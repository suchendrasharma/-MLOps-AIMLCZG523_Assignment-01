[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
description = "Heart disease risk classifier with an end-to-end MLOps pipeline"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["slow: end-to-end tests that run real training (deselect with -m 'not slow')"]
filterwarnings = [
    # third-party: mlflow 2.17 still uses pydantic v1-style validators
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["heart"]

[tool.coverage.report]
show_missing = true
skip_empty = true
